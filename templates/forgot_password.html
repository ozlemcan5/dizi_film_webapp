<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Şifremi Unuttum - Ne İzlesem?</title>
    <style>
        body { background-color: #d3cccc; color: #222222; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #f2f2f2; padding: 30px; border-radius: 12px; width: 320px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); }
        h2 { color: #000000; text-align: center; margin-bottom: 15px; font-size: 20px; }
        p { font-size: 13px; color: #555; text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #ccc; background: #ffffff; color: #000; box-sizing: border-box; }
        button { width: 100%; background: #f1e07e; color: #000; border: none; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #e96472; text-decoration: none; font-weight: bold; font-size: 14px; }
        .alert { background: #e96472; color: white; padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: center; font-size: 14px; font-weight: bold; }
        .info { background: #1e7e34; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔒 Şifre Sıfırlama</h2>
        <p>Kayıtlı e-posta adresinizi veya telefon numaranızı girin.</p>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert {% if category == 'info' %}info{% endif %}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST">
            <input type="text" name="identifier" placeholder="E-posta veya Telefon" required>
            <button type="submit">Kod Gönder</button>
        </form>
        <a href="{{ url_for('login') }}" class="back-link">← Giriş Ekranına Dön</a>
    </div>
</body>
</html>
